# ─── PayFlow Go Microservice Deployments ─────────────────────────────────────
# 5 core services: api-gateway, auth, account, transaction, ledger
# Each pod gets an Envoy sidecar automatically (namespace has istio-injection=enabled)
#
# Apply: kubectl apply -f k8s/deployments.yaml
#
# Build images first (replace 'payflow' with your Minikube registry):
#   eval $(minikube docker-env)
#   docker build -t payflow/api-gateway:latest    -f cmd/api-gateway/Dockerfile    .
#   docker build -t payflow/auth-service:latest   -f cmd/auth-service/Dockerfile   .
#   docker build -t payflow/account-service:latest -f cmd/account-service/Dockerfile .
#   docker build -t payflow/transaction-service:latest -f cmd/transaction-service/Dockerfile .
#   docker build -t payflow/ledger-service:latest  -f cmd/ledger-service/Dockerfile  .

---
# ─── API Gateway (port 8080) ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-api-gateway
  namespace: payflow
  labels:
    app: payflow-api-gateway
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payflow-api-gateway
  template:
    metadata:
      labels:
        app: payflow-api-gateway
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8080"
    spec:
      containers:
      - name: api-gateway
        image: payflow/api-gateway:latest
        imagePullPolicy: Never      # use local Minikube image
        ports:
        - { containerPort: 8080, name: http }
        envFrom:
        - configMapRef: { name: payflow-config }
        - secretRef:    { name: payflow-secrets }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "256Mi", cpu: "500m" }
        livenessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet: { path: /health, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payflow-api-gateway
  namespace: payflow
spec:
  selector:
    app: payflow-api-gateway
  ports:
  - { port: 8080, targetPort: 8080, name: http }

