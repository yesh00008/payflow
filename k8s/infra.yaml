# ─── PayFlow Infrastructure (Postgres, Redis, RabbitMQ) ──────────────────────
# Apply: kubectl apply -f k8s/infra.yaml
---
# Postgres
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-postgres
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payflow-postgres
  template:
    metadata:
      labels:
        app: payflow-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - { name: POSTGRES_USER,     value: fintech }
        - { name: POSTGRES_PASSWORD, value: fintech123 }
        - { name: POSTGRES_DB,       value: payflow }
        ports:
        - containerPort: 5432
        resources:
          requests: { memory: "256Mi", cpu: "250m" }
          limits:   { memory: "512Mi", cpu: "500m" }
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "fintech", "-d", "payflow"]
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payflow-postgres
  namespace: payflow
spec:
  selector:
    app: payflow-postgres
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres

---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-redis
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payflow-redis
  template:
    metadata:
      labels:
        app: payflow-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        resources:
          requests: { memory: "64Mi",  cpu: "50m" }
          limits:   { memory: "128Mi", cpu: "100m" }
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payflow-redis
  namespace: payflow
spec:
  selector:
    app: payflow-redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis

---
# RabbitMQ
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-rabbitmq
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payflow-rabbitmq
  template:
    metadata:
      labels:
        app: payflow-rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management-alpine
        env:
        - { name: RABBITMQ_DEFAULT_USER, value: fintech }
        - { name: RABBITMQ_DEFAULT_PASS, value: rabbit123 }
        ports:
        - { containerPort: 5672,  name: amqp }
        - { containerPort: 15672, name: management }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "256Mi", cpu: "250m" }
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "ping"]
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payflow-rabbitmq
  namespace: payflow
spec:
  selector:
    app: payflow-rabbitmq
  ports:
  - { port: 5672,  targetPort: 5672,  name: amqp }
  - { port: 15672, targetPort: 15672, name: management }

---
# Jaeger All-in-One (tracing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payflow-jaeger
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payflow-jaeger
  template:
    metadata:
      labels:
        app: payflow-jaeger
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/all-in-one:latest
        ports:
        - { containerPort: 4317,  name: otlp-grpc }
        - { containerPort: 4318,  name: otlp-http }
        - { containerPort: 16686, name: ui }
        resources:
          requests: { memory: "128Mi", cpu: "100m" }
          limits:   { memory: "256Mi", cpu: "250m" }
---
apiVersion: v1
kind: Service
metadata:
  name: payflow-jaeger
  namespace: payflow
spec:
  selector:
    app: payflow-jaeger
  ports:
  - { port: 4317,  targetPort: 4317,  name: otlp-grpc }
  - { port: 4318,  targetPort: 4318,  name: otlp-http }
  - { port: 16686, targetPort: 16686, name: ui }
