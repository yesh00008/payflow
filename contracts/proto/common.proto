syntax = "proto3";

package payflow.common;

option go_package = "github.com/payflow/contracts/proto/common";

import "google/protobuf/timestamp.proto";

// Shared message types across all PayFlow gRPC services

message Money {
  int64 amount = 1;       // Amount in minor units (cents)
  string currency = 2;    // ISO 4217 currency code (e.g., "USD")
}

message PaginationRequest {
  int32 page_size = 1;    // Max items per page (default 50)
  string page_token = 2;  // Continuation token from previous response
}

message PaginationResponse {
  string next_page_token = 1;
  int32 total_count = 2;
}

message ServiceHealth {
  string service_name = 1;
  string version = 2;
  HealthStatus status = 3;
  google.protobuf.Timestamp checked_at = 4;
  map<string, string> dependencies = 5;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

// Standard error detail for gRPC responses
message ErrorDetail {
  string code = 1;
  string message = 2;
  map<string, string> metadata = 3;
}

// Audit context passed between services
message AuditContext {
  string user_id = 1;
  string request_id = 2;
  string source_service = 3;
  string ip_address = 4;
  google.protobuf.Timestamp timestamp = 5;
}
