version: "3.9"

# ─── PayFlow — Docker Compose (local development / log collection) ────────────
# Services: api-gateway, auth, account, transaction, ledger + infra
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose logs -f             # stream all service logs
#   docker compose logs -f api-gateway # stream one service

networks:
  payflow:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mongo_data:

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech123
      POSTGRES_DB: payflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [payflow]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d payflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks: [payflow]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fintech
      RABBITMQ_DEFAULT_PASS: rabbit123
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    networks: [payflow]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Observability ───────────────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC (replaces tempo:4317)
      - "4318:4318"    # OTLP HTTP
    networks: [payflow]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: fintech
      MONGO_INITDB_ROOT_PASSWORD: mongo123
      MONGO_INITDB_DATABASE: audit
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks: [payflow]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Go Microservices ─────────────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: cmd/auth-service/Dockerfile
    image: payflow/auth-service:latest
    env_file: .env
    environment:
      PORT: "8081"
      SERVICE_NAME: auth-service
    ports:
      - "8081:8081"
    networks: [payflow]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  account-service:
    build:
      context: .
      dockerfile: cmd/account-service/Dockerfile
    image: payflow/account-service:latest
    env_file: .env
    environment:
      PORT: "8083"
      SERVICE_NAME: account-service
    ports:
      - "8083:8083"
    networks: [payflow]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
